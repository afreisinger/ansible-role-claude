---
# defaults file for afreisinger.claude

# Target user — must exist on the system before the role runs.
# Claude Code will be installed for this user only, never as root.
claude_user: ""

# Directory where the user's Claude Code projects will live.
# Must exist unless claude_create_projects_dir is true.
claude_projects_dir: ""

# Create claude_projects_dir if it does not exist.
claude_create_projects_dir: false

# npm package version — "latest" or a pinned version like "1.0.3"
claude_version: "latest"

# Remote service — deploy the unit file (does NOT start the service)
claude_remote_service_deploy: false

# Enable and start claude-remote.service (requires claude login first)
claude_remote_service_enabled: false

# tmux session name used by claude-remote.service
claude_remote_tmux_session: "claude"

# Optional env file with ANTHROPIC_API_KEY (and any other env vars).
# The leading '-' in EnvironmentFile means it's optional — missing file is not an error.
claude_remote_env_file: "/etc/claude/{{ claude_user }}.env"
